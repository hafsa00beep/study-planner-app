<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المذاكرة - Study Planner</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f3f4f6; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { color: #4f46e5; }
        input { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        button { padding: 10px 15px; background: #4f46e5; color: white; border: none; border-radius: 5px; cursor: pointer; }
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { background: #e0e7ff; margin: 10px 0; padding: 10px; border-radius: 5px; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📅 منظم المذاكرة اليومي</h2>
        <p>أضف مهامك الدراسية هنا</p>
        <div>
            <input type="text" placeholder="مثال: مراجعة درس البايثون...">
            <button>إضافة</button>
        </div>
        <ul>
            <li>✅ تطبيق على كود HTML & CSS</li>
            <li>⏳ المذاكرة لمدة ساعة</li>
        </ul>
    </div>
</body>
</html>
