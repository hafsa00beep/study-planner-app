<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظم المذاكرة - Study Planner</title>
    <!-- خط القاهرة العربي الاحترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة التأثيرات والبريق Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --lavender-bg: #f3effa;
            --lavender-card: #e9e0f7;
            --lavender-main: #d8c7f3;
            --purple-accent: #8b5cf6;
            --purple-dark: #6d28d9;
            --purple-deep: #4c1d95;
            --white: #ffffff;
            --text-dark: #374151;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s ease;
        }

        body {
            background: linear-gradient(135deg, #f8f6fc 0%, #ede7f8 100%);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 50px 20px 100px 20px;
        }

        /* ضبط الهيدر العلوي بشكل كامل */
        header {
            text-align: center;
            margin-bottom: 35px;
            width: 100%;
            display: block;
        }

        header h1 {
            color: var(--purple-deep);
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        header p {
            color: var(--purple-dark);
            font-size: 1.05rem;
            font-weight: 600;
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        @media (min-width: 850px) {
            .main-container {
                grid-template-columns: 350px 1fr;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            border: 2px solid var(--lavender-main);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.08);
        }

        .card-title {
            color: var(--purple-dark);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px dashed var(--lavender-main);
            padding-bottom: 10px;
        }

        /* قسم المؤقت */
        .timer-section {
            text-align: center;
        }

        .timer-inputs-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--purple-dark);
            margin-top: 5px;
        }

        .timer-inputs-wrapper input {
            width: 70px;
            height: 48px;
            border: 2px solid var(--lavender-main);
            border-radius: 12px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--purple-deep);
            outline: none;
            background: var(--white);
        }

        .timer-inputs-wrapper input:focus {
            border-color: var(--purple-accent);
        }

        .timer-display {
            background: linear-gradient(135deg, var(--purple-accent), var(--purple-dark));
            color: var(--white);
            font-size: 3.5rem;
            font-weight: 800;
            padding: 15px;
            border-radius: 18px;
            margin: 15px 0;
            letter-spacing: 2px;
            direction: ltr;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--purple-accent);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--purple-dark);
        }

        .btn-secondary {
            background: var(--lavender-card);
            color: var(--purple-deep);
        }

        .btn-secondary:hover {
            background: var(--lavender-main);
        }

        .congrats-box {
            display: none;
            margin-top: 18px;
            padding: 18px;
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            color: var(--white);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
        }

        .congrats-box h3 {
            font-size: 1.5rem;
            color: var(--white);
            font-weight: 800;
            margin-bottom: 4px;
        }

        .congrats-box p {
            font-size: 0.95rem;
            color: #f3e8ff;
            font-weight: 600;
        }

        /* شبكة المواد وإصلاح خطوط التاريخ */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 16px;
        }

        .subject-card {
            background: var(--white);
            border: 1.5px solid var(--lavender-card);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .subject-card:hover {
            border-color: var(--purple-accent);
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .subject-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--purple-deep);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.95rem;
            opacity: 0.7;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        .date-picker-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .date-picker-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* إصلاح حقل الإدخال للتاريخ تماماً */
        .date-picker-group input[type="date"] {
            padding: 9px 12px;
            border: 1.5px solid var(--lavender-main);
            border-radius: 10px;
            font-size: 0.9rem;
            color: var(--text-dark);
            background: var(--lavender-bg);
            outline: none;
            font-family: system-ui, -apple-system, sans-serif; /* منع تشوه رموز التاريخ */
        }

        .date-picker-group input[type="date"]:focus {
            border-color: var(--purple-accent);
            background: var(--white);
        }

        /* الزر العائم */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--purple-accent), var(--purple-dark));
            color: var(--white);
            border: none;
            font-size: 1.4rem;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .fab:hover {
            transform: scale(1.08);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--white);
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 380px;
        }

        .modal-content h3 {
            color: var(--purple-deep);
            margin-bottom: 12px;
        }

        .modal-content input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--lavender-main);
            border-radius: 10px;
            margin-bottom: 15px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-graduation-cap"></i> منظم المذاكرة والمهام</h1>
        <p>نظّم وقتك بهدوء ولطافة واصنع إنجازك اليومي 💜</p>
    </header>

    <div class="main-container">
        
        <!-- المؤقت -->
        <div class="card timer-section">
            <div class="card-title"><i class="fa-solid fa-stopwatch"></i> مؤقت التركيز (Pomodoro)</div>
            
            <div class="timer-inputs-wrapper">
                <div class="input-group">
                    <input type="number" id="inputMinutes" min="0" max="180" value="25" onchange="updateTimerFromInputs()">
                    <label>دقيقة</label>
                </div>
                <span style="font-size: 1.4rem; font-weight:bold; color:var(--purple-accent);">:</span>
                <div class="input-group">
                    <input type="number" id="inputSeconds" min="0" max="59" value="0" onchange="updateTimerFromInputs()">
                    <label>ثانية</label>
                </div>
            </div>

            <div class="timer-display" id="timerDisplay">25:00</div>

            <div class="timer-controls">
                <button class="btn btn-primary" onclick="startTimer()"><i class="fa-solid fa-play"></i> بدء</button>
                <button class="btn btn-secondary" onclick="pauseTimer()"><i class="fa-solid fa-pause"></i> إيقاف</button>
                <button class="btn btn-secondary" onclick="resetTimer()"><i class="fa-solid fa-rotate-left"></i> إعادة</button>
            </div>

            <div class="congrats-box" id="congratsBox">
                <h3>أحسنت يا بطل! 🌟</h3>
                <p>صانعة الموقع حفصة فخورة بك 💜</p>
            </div>
        </div>

        <!-- المواد -->
        <div class="card">
            <div class="card-title"><i class="fa-solid fa-book-open"></i> مواد الدراسة والمواعيد</div>
            <div class="subjects-grid" id="subjectsGrid"></div>
        </div>

    </div>

    <!-- الزر العائم -->
    <button class="fab" onclick="openAddSubjectModal()" title="إضافة مادة جديدة">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div class="modal" id="subjectModal">
        <div class="modal-content">
            <h3>إضافة مادة دراسية جديدة</h3>
            <input type="text" id="newSubjectName" placeholder="أدخل اسم المادة...">
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAddSubjectModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="addNewSubject()">إضافة</button>
            </div>
        </div>
    </div>

    <script>
        const defaultSubjects = [
            { id: 1, name: "الرياضيات", date: "" },
            { id: 2, name: "العلوم", date: "" },
            { id: 3, name: "اللغة الإنجليزية", date: "" },
            { id: 4, name: "اللغة العربية", date: "" },
            { id: 5, name: "الدراسات الاجتماعية", date: "" }
        ];

        let subjects = [];
        let timerInterval = null;
        let totalSeconds = 25 * 60;
        let isRunning = false;

        // تحميل البيانات المحفوظة فور فتح الموقع
        window.onload = function() {
            const savedSubjects = localStorage.getItem("hafsa_study_planner_subjects");
            if (savedSubjects) {
                subjects = JSON.parse(savedSubjects);
            } else {
                subjects = defaultSubjects;
                saveSubjects();
            }
            renderSubjects();
            updateTimerFromInputs();
        };

        function saveSubjects() {
            localStorage.setItem("hafsa_study_planner_subjects", JSON.stringify(subjects));
        }

        function renderSubjects() {
            const grid = document.getElementById("subjectsGrid");
            grid.innerHTML = "";

            subjects.forEach(subject => {
                const card = document.createElement("div");
                card.className = "subject-card";
                card.innerHTML = `
                    <div class="subject-header">
                        <span class="subject-name">${subject.name}</span>
                        <button class="delete-btn" onclick="deleteSubject(${subject.id})" title="حذف المادة"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="date-picker-group">
                        <label>تاريخ الامتحان / المراجعة:</label>
                        <input type="date" value="${subject.date || ''}" onchange="updateSubjectDate(${subject.id}, this.value)">
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateSubjectDate(id, newDate) {
            const sub = subjects.find(s => s.id === id);
            if (sub) {
                sub.date = newDate;
                saveSubjects(); // حفظ التعديل فورياً في ذاكرة المتصفح
            }
        }

        function openAddSubjectModal() {
            document.getElementById("subjectModal").style.display = "flex";
            document.getElementById("newSubjectName").focus();
        }

        function closeAddSubjectModal() {
            document.getElementById("subjectModal").style.display = "none";
            document.getElementById("newSubjectName").value = "";
        }

        function addNewSubject() {
            const nameInput = document.getElementById("newSubjectName");
            const name = nameInput.value.trim();
            if (name) {
                const newSubject = { id: Date.now(), name: name, date: "" };
                subjects.push(newSubject);
                saveSubjects();
                renderSubjects();
                closeAddSubjectModal();
            }
        }

        function deleteSubject(id) {
            if (confirm("هل أنتِ متأكدة من حذف هذه المادة؟")) {
                subjects = subjects.filter(s => s.id !== id);
                saveSubjects();
                renderSubjects();
            }
        }

        // تحديث أرقام المؤقت من المدخلات مباشرة
        function updateTimerFromInputs() {
            if (isRunning) return;
            const mInput = parseInt(document.getElementById("inputMinutes").value) || 0;
            const sInput = parseInt(document.getElementById("inputSeconds").value) || 0;
            totalSeconds = (mInput * 60) + sInput;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            document.getElementById("timerDisplay").textContent = 
                `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function startTimer() {
            if (isRunning) return;

            // أخذ القيم من المدخلات فور الدوس على بدء
            const mInput = parseInt(document.getElementById("inputMinutes").value) || 0;
            const sInput = parseInt(document.getElementById("inputSeconds").value) || 0;
            
            totalSeconds = (mInput * 60) + sInput;

            if (totalSeconds <= 0) return;

            document.getElementById("congratsBox").style.display = "none";
            isRunning = true;

            timerInterval = setInterval(() => {
                totalSeconds--;
                updateTimerDisplay();

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isRunning = false;
                    triggerCompletion();
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
        }

        function resetTimer() {
            pauseTimer();
            updateTimerFromInputs();
            document.getElementById("congratsBox").style.display = "none";
        }

        function triggerCompletion() {
            document.getElementById("congratsBox").style.display = "block";
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 },
                colors: ['#8b5cf6', '#d8c7f3', '#fef08a', '#ffffff']
            });
        }
    </script>
</body>
</html>
